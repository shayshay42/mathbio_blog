<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export the Angel-5 model</title>
<body>
  <p>Export the original cartoon-style Angel-5 geometry, materials, and drawer label as a GLB file.</p>
  <button type="button">Download model</button>
  <p role="status"></p>
  <script type="module">
    import { createSharpener } from '../sharpener-model.js';
    import { GLTFExporter } from '../assets/vendor/GLTFExporter.js';
    const button = document.querySelector('button');
    const status = document.querySelector('[role="status"]');
    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const { group } = createSharpener();
        const binary = await new GLTFExporter().parseAsync(group, { binary: true });
        const url = URL.createObjectURL(new Blob([binary], { type: 'model/gltf-binary' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'angel-5.glb';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = 'Model exported.';
      } catch (error) {
        status.textContent = `Export failed: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
