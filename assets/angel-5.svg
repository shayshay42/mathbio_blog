  <path d="m157 98 11-5 21 3-11 5Z" fill="#686a60"/>
  <path d="m178 101 11-5-1 31-11 6Z" fill="#1d2621"/>
  <path d="m225 141 1-31 21 3-1 32Z" fill="url(#black)" stroke="#151e19" stroke-width="1.5"/>
  <path d="m226 110 12-5 21 3-12 5Z" fill="#65695e"/>
  <path d="m247 113 12-5-1 31-12 6Z" fill="#1c251f"/>
  <path d="m160 102 13 2m57 10 13 2" stroke="#85867a" stroke-width="1" opacity=".8"/>

