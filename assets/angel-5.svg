  <path d="m137 130 145 24q10 2 11 13" fill="none" stroke="#ffb384" stroke-width="2" opacity=".67"/>
  <path d="M122 305v88q-1 17 14 20l141 25" fill="none" stroke="#f56a49" stroke-width="2" opacity=".6"/>
  <path d="m318 164 8-4-5 227-8 5Z" fill="#ed5c3d" opacity=".2"/>
  <path d="m375 135-7 247" stroke="#70251e" stroke-width="2" opacity=".45"/>

  <!-- Pencil feed mechanism and its two black grips. -->
  <path d="m150 124 40-19 93 15-37 19Z" fill="#242b27" stroke="#60645b" stroke-width="2"/>
  <path d="m177 118 27-13 47 8-27 13Z" fill="#8f9388"/>
