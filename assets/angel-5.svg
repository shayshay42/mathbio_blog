    <path d="M128 370q74-13 151 18v33l-151-26Z" fill="#746947" opacity=".6"/>
    <g fill="#cca578" stroke="#8b6848" stroke-width=".9">
      <path d="m143 379q-6-15 9-16l21 7q-18 2-11 15l-8 8Z"/>
      <path d="m163 388q7-25 24-11l8 14q-12-7-18 10Z"/>
      <path d="m198 380q-7-19 9-20l20 14q-18-3-16 14Z"/>
      <path d="m217 404q-10-21 8-26l23 10q-17-2-15 20Z"/>
      <path d="m250 399q-8-15 5-19l21 9q-16 0-12 16Z"/>
      <path d="m135 396q12-18 29-5l1 15Z"/>
      <path d="m179 409q-9-21 3-25l20 8q-10 5-6 21Z"/>
    </g>
    <g fill="none" stroke="#e8c89b" stroke-width="1.8" opacity=".9">
      <path d="m145 378q-3-12 11-11m17 20q4-15 13-7m17-2q-5-16 5-14m16 37q-4-19 15-17m12 13q-7-13 3-14"/>
    </g>
    <g fill="none" stroke="#554f3d" stroke-width="2" stroke-linecap="round">
      <path d="m150 390 3 4m44-2 7 4m33-22 5 3m9 29 8 3m-78-1 4 2m-38-30 6 1m101 14 6 3"/>
    </g>
  </g>
  <path d="m137 294 143 24-1 96-148-25Z" fill="url(#glass)" stroke="#c7d1c5" stroke-width="1.6"/>
  <path d="m140 298 21 4-4 86-21-4Z" fill="#fffef1" opacity=".22"/>
  <path d="m252 317 24 4-1 87-27-4Z" fill="url(#glass-side)"/>
  <path d="m137 294 8 5-4 83 132 23 6 9m-26-99-4 87" stroke="#f1f1df" stroke-width="1.4" fill="none" opacity=".66"/>
