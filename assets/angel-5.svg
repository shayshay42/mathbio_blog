  <path d="m144 150 124 21q13 2 13 15l-2 79q0 11-14 10l-130-22q-7-1-6-12l6-80q0-12 9-11Z" fill="url(#chrome)" stroke="#d0d2c6" stroke-width="1"/>
  <path d="m147 153 120 20q10 2 11 10" stroke="#fffcf2" stroke-width="2.5" opacity=".7" fill="none"/>
  <path d="m135 248 129 23q9 1 12-3" stroke="#67716a" stroke-width="1.2" opacity=".65" fill="none"/>
  <ellipse cx="204" cy="214" rx="15" ry="17" transform="rotate(-8 204 214)" fill="url(#hole)"/>
  <ellipse cx="204" cy="214" rx="6.5" ry="9" transform="rotate(-8 204 214)" fill="#17251c"/>
  <path d="m198 204 2 5m8 10 1 5" stroke="#dedfce" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- A recessed, removable clear shavings drawer. -->
  <path d="m133 283 151 25 1 111-161-27Z" fill="#782c24" stroke="#9e3328" stroke-width="2"/>
  <path d="m137 290 143 24 1 102-151-26Z" fill="#54665b" stroke="#e5c6ac" stroke-width="2"/>
  <path d="m146 295 133 23-1 90-139-25Z" fill="#929f8e" opacity=".35"/>
