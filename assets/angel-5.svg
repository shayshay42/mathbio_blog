<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="angel-title angel-desc">
  <title id="angel-title">A red Angel-5 pencil sharpener</title>
  <desc id="angel-desc">An original illustration of a red metal hand-crank pencil sharpener, with a polished silver face, black pencil grips, and a clear drawer holding curled pencil shavings.</desc>
  <defs>
    <linearGradient id="red-front" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#ee563b"/><stop offset=".38" stop-color="#d93d2c"/><stop offset=".86" stop-color="#ba3025"/><stop offset="1" stop-color="#922d27"/></linearGradient>
    <linearGradient id="red-side" x1="0" y1="0" x2="1" y2=".1"><stop stop-color="#cf3529"/><stop offset=".62" stop-color="#b42b25"/><stop offset="1" stop-color="#892821"/></linearGradient>
    <linearGradient id="red-top" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#f57757"/><stop offset=".42" stop-color="#e84931"/><stop offset="1" stop-color="#b52c24"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".87" y2="1"><stop stop-color="#f8f5ea"/><stop offset=".15" stop-color="#a3a7a0"/><stop offset=".24" stop-color="#e4e3d9"/><stop offset=".54" stop-color="#f4f1e8"/><stop offset=".74" stop-color="#b7bdb6"/><stop offset=".89" stop-color="#f1efe6"/><stop offset="1" stop-color="#727b75"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#515854"/><stop offset=".13" stop-color="#f3f1e9"/><stop offset=".25" stop-color="#818780"/><stop offset=".8" stop-color="#e2e3d9"/><stop offset="1" stop-color="#5a645f"/></linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#565651"/><stop offset=".4" stop-color="#2a2d2b"/><stop offset="1" stop-color="#141e1b"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#e4e7dc" stop-opacity=".8"/><stop offset=".28" stop-color="#abbdb5" stop-opacity=".56"/><stop offset=".78" stop-color="#d9e0d5" stop-opacity=".7"/><stop offset="1" stop-color="#83998f" stop-opacity=".7"/></linearGradient>
    <linearGradient id="glass-side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#819c91" stop-opacity=".36"/><stop offset="1" stop-color="#e2e9df" stop-opacity=".72"/></linearGradient>
    <radialGradient id="hole"><stop stop-color="#171d19"/><stop offset=".55" stop-color="#202622"/><stop offset=".7" stop-color="#69716a"/><stop offset=".8" stop-color="#eeeae0"/><stop offset="1" stop-color="#909b91"/></radialGradient>
    <filter id="shadow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="11"/></filter>
    <clipPath id="drawer-clip"><path d="M137 297 280 322 279 413 131 388Z"/></clipPath>
  </defs>

