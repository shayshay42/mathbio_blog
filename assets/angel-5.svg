  <ellipse cx="268" cy="449" rx="151" ry="17" fill="#504631" opacity=".13" filter="url(#shadow)"/>
  <path d="m145 418 6 19 28 5 3-15m135 8 5 11 27-12 1-15" fill="#29312b"/>

  <!-- The rear crank: bent steel, axle, and a ribbed black handle. -->
  <ellipse cx="366" cy="225" rx="19" ry="26" transform="rotate(15 366 225)" fill="#77271f" stroke="#9b3025" stroke-width="4"/>
  <ellipse cx="368" cy="223" rx="11" ry="17" transform="rotate(15 368 223)" fill="url(#rim)" stroke="#49534e" stroke-width="2"/>
  <path d="m369 223 19-8 47 92 28-14 5 10-33 18q-5 2-8-4Z" fill="url(#chrome)" stroke="#515951" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="m388 222 42 85q4 8 10 5l23-12" fill="none" stroke="#fff9e7" stroke-width="2" opacity=".8"/>
  <g transform="rotate(-28 462 291)">
